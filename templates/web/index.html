<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-primary">
<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="text-white display-4 fw-bold">Employee Management</h1>
  </div>

  <div class="card shadow">
    <div class="card-body">
      <button class="btn btn-success mb-4" data-bs-toggle="modal" data-bs-target="#modal">Add Employee</button>
      
      <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
      </div>

      <table class="table table-striped d-none" id="table">
        <thead class="table-dark">
          <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Salary</th><th>Department</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5>Add/Edit Employee</h5></div>
      <div class="modal-body">
        <input type="hidden" id="id">
        <input type="text" class="form-control mb-2" placeholder="Name" id="name">
        <input type="email" class="form-control mb-2" placeholder="Email" id="email">
        <input type="number" class="form-control mb-2" placeholder="Salary" id="salary">
        <input type="text" class="form-control mb-2" placeholder="Department" id="department">
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="save()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
// CHANGE THIS ONLY ↓↓↓
const API_KEY = "c1c94492a7e44a098d90bd830ed2f490";

const h = { "X-API-Key": API_KEY, "Content-Type": "application/json" };

async function load() {
  const r = await fetch("/employee/", { headers: h });
  const data = await r.json();
  const tbody = document.getElementById("body");
  tbody.innerHTML = "";
  data.forEach(e => {
    tbody.innerHTML += `<tr>
      <td>${e.id}</td>
      <td>${e.name}</td>
      <td>${e.email}</td>
      <td>$${e.salary}</td>
      <td>${e.department}</td>
      <td>
        <button class="btn btn-sm btn-warning" onclick="edit(${e.id})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="del(${e.id})">Del</button>
      </td>
    </tr>`;
  });
  document.getElementById("loading").classList.add("d-none");
  document.getElementById("table").classList.remove("d-none");
}

function edit(id) {
  fetch(`/employee/${id}/`, { headers: h })
    .then(r => r.json())
    .then(d => {
      document.getElementById("id").value = id;
      document.getElementById("name").value = d.name;
      document.getElementById("email").value = d.email;
      document.getElementById("salary").value = d.salary;
      document.getElementById("department").value = d.department;
      new bootstrap.Modal(document.getElementById("modal")).show();
    });
}

async function save() {
  const id = document.getElementById("id").value;
  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    salary: +document.getElementById("salary").value,
    department: document.getElementById("department").value
  };
  const method = id ? "PUT" : "POST";
  const url = id ? `/employee/${id}/` : "/employee/";
  await fetch(url, { method, headers: h, body: JSON.stringify(payload) });
  bootstrap.Modal.getInstance(document.getElementById("modal")).hide();
  load();
}

async function del(id) {
  if(confirm("Delete?")) {
    await fetch(`/employee/${id}/`, { method: "DELETE", headers: h });
    load();
  }
}

// Start
document.querySelector("[data-bs-toggle='modal']").onclick = () => {
  document.getElementById("id").value = "";
  document.querySelectorAll("#name,#email,#salary,#department").forEach(i=>i.value="");
};
load();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
