<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px 0; }
    .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .table th { background-color: #667eea; color: white; }
    .btn-primary { background: #667eea; border: none; }
    .btn-primary:hover { background: #5a6fd8; }
  </style>
</head>
<body>
<div class="container">
  <div class="card mt-4">
    <div class="card-header bg-primary text-white text-center py-4">
      <h1><i class="bi bi-people-fill"></i> Employee Management System</h1>
      <p class="mb-0">Connected to your Django API • Real-time CRUD</p>
    </div>
    <div class="card-body">
      <button class="btn btn-success btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#employeeModal">
        <i class="bi bi-person-plus"></i> Add New Employee
      </button>

      <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
        <p class="mt-3">Loading employees...</p>
      </div>

      <table class="table table-hover d-none" id="employeeTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Salary</th>
            <th>Department</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employeeBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="employeeModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Employee Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Salary</label>
          <input type="number" class="form-control" id="salary" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Department</label>
          <input type="text" class="form-control" id="department" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveBtn">Save Employee</button>
      </div>
    </div>
  </div>
</div>

<script>
// ================= CONFIG =================
const API_BASE = "http://127.0.0.1:8000";
const API_KEY = "c1c94492a7e44a098d90bd830ed2f490";   // ← CHANGE THIS!

const headers = {
  "Content-Type": "application/json",
  "X-API-Key": API_KEY
};

// ================= FUNCTIONS =================
async function loadEmployees() {
  try {
    const res = await fetch(`${API_BASE}/employee/`, { headers });
    const data = await res.json();
    
    const tbody = document.getElementById("employeeBody");
    tbody.innerHTML = "";
    
    data.forEach(emp => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${emp.id}</td>
        <td>${emp.name}</td>
        <td>${emp.email}</td>
        <td>$${emp.salary}</td>
        <td><span class="badge bg-info">${emp.department}</span></td>
        <td>
          <button class="btn btn-sm btn-warning" onclick="editEmployee(${emp.id})"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${emp.id})"><i class="bi bi-trash"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("loading").classList.add("d-none");
    document.getElementById("employeeTable").classList.remove("d-none");
  } catch (err) {
    Swal.fire("Error", "Cannot connect to API. Is server running?", "error");
  }
}

function openModal(id = null) {
  document.getElementById("editId").value = id || "";
  document.getElementById("name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("salary").value = "";
  document.getElementById("department").value = "";
  
  if (id) {
    fetch(`${API_BASE}/employee/${id}/`, { headers })
      .then(r => r.json())
      .then(d => {
        document.getElementById("name").value = d.name;
        document.getElementById("email").value = d.email;
        document.getElementById("salary").value = d.salary;
        document.getElementById("department").value = d.department;
      });
  }
  new bootstrap.Modal(document.getElementById("employeeModal")).show();
}

async function saveEmployee() {
  const id = document.getElementById("editId").value;
  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    salary: parseFloat(document.getElementById("salary").value),
    department: document.getElementById("department").value
  };

  const method = id ? "PUT" : "POST";
  const url = id ? `${API_BASE}/employee/${id}/` : `${API_BASE}/employee/`;

  await fetch(url, { method, headers, body: JSON.stringify(payload) });
  bootstrap.Modal.getInstance(document.getElementById("employeeModal")).hide();
  loadEmployees();
  Swal.fire("Success!", id ? "Updated" : "Created", "success");
}

async function deleteEmployee(id) {
  if (!confirm("Delete this employee?")) return;
  await fetch(`${API_BASE}/employee/${id}/`, { method: "DELETE", headers });
  loadEmployees();
  Swal.fire("Deleted!", "", "success");
}

// ================= START =================
document.getElementById("saveBtn").onclick = saveEmployee;
document.querySelector("[data-bs-target='#employeeModal']").onclick = () => openModal();
loadEmployees();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
